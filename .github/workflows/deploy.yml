name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '24'
  TERRAFORM_VERSION: '1.9.8'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The registry worker's visibility enforcement suite (node --test, no
      # deps). Runs before any plan/apply so a change that would leak a
      # private or draft skill never reaches a deploy.
      - name: Worker tests
        run: npm test --prefix worker

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform format check
        run: terraform fmt -check -recursive
        working-directory: ./terraform

      - name: Terraform init
        run: terraform init -backend=false
        working-directory: ./terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: ./terraform

  plan-and-apply:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Restore Terraform state
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ hashFiles('terraform/*.tf') }}
          restore-keys: |
            terraform-state-

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build
        env:
          VITE_SKILL_API_URL: https://skills.dmzagent.com/api

      # The house preflight (see uni's ops/preflight-cf-token.sh and
      # monitor-cf-token.yml): verify the token against
      # /user/tokens/verify BEFORE terraform touches it, so a dead or
      # corrupted CLOUDFLARE_API_TOKEN fails here with one named line and
      # the exact fix — not as three "failed to make http request" errors
      # buried in a terraform plan. The token is checked exactly as stored
      # (no trimming): a trailing newline from a careless paste is a real
      # failure this exists to catch.
      #
      # CLOUDFLARE_API_TOKEN is injected from the ORGANIZATION's secrets:
      # `secrets.<name>` resolves the org secret when this repository is in
      # its access list and no repository-level secret of the same name
      # shadows it. Do not create a repo-level copy — a stale shadow serving
      # a dead token while the org holds a good one is the exact failure
      # that motivated this step.
      - name: Cloudflare token preflight
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN::secret resolved empty — grant this repository access to the organization secret (org Settings -> Secrets and variables -> Actions -> CLOUDFLARE_API_TOKEN -> Repository access)"
            exit 1
          fi
          # Fingerprint and shape only — never the value (see the house rule on
          # secrets). Lets whoever set the secret confirm from the CI log alone
          # that what resolves here is what they pasted:
          #   printf '%s' "$YOUR_TOKEN" | sha256sum | cut -c1-12
          token_fp=$(printf '%s' "$CF_TOKEN" | sha256sum | cut -c1-12)
          case "$CF_TOKEN" in
            cfat_*) token_kind="account-owned (cfat_ prefix)" ;;
            *)      token_kind="no cfat_ prefix (user-token shape)" ;;
          esac
          echo "::notice title=CLOUDFLARE_API_TOKEN::resolved length=${#CF_TOKEN} sha256[0:12]=$token_fp kind=$token_kind"

          # Two token types, two registries. A *user* API token verifies at
          # /user/tokens/verify; an *account-owned* token — the type Cloudflare
          # recommends for CI, marked by the cfat_ prefix — is not in the user
          # registry at all, so that endpoint answers code 1000 "Invalid API
          # Token" for a perfectly live credential. Checking only the user
          # endpoint therefore fails the deploy on exactly the token type this
          # workflow should be holding. Try both, and accept the token if
          # either registry calls it active.
          verify() {
            curl -sS --max-time 30 \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              "$1"
          }
          report() {
            echo "  $1 -> success=$(echo "$2" | jq -r '.success') status=$(echo "$2" | jq -r '.result.status // "none"') errors=$(echo "$2" | jq -c '.errors // []')"
          }
          active() {
            [ "$(echo "$1" | jq -r '.success')" = "true" ] && [ "$(echo "$1" | jq -r '.result.status // "none"')" = "active" ]
          }

          echo "token verification attempts:"
          user_body=$(verify "https://api.cloudflare.com/client/v4/user/tokens/verify") || {
            echo "::error title=CLOUDFLARE_API_TOKEN::user tokens/verify request failed (network/curl error)"
            exit 1
          }
          report "user/tokens/verify" "$user_body"
          if active "$user_body"; then
            echo "token verified: active (user token)"
            exit 0
          fi

          if [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo "::error title=CLOUDFLARE_API_TOKEN::the user registry rejected this token and CLOUDFLARE_ACCOUNT_ID is empty, so the account-owned registry cannot be checked. That secret is already used for TF_VAR_cloudflare_account_id in the steps below — grant this repository access to it, or rotate the token."
            exit 1
          fi

          acct_body=$(verify "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/tokens/verify") || {
            echo "::error title=CLOUDFLARE_API_TOKEN::account tokens/verify request failed (network/curl error)"
            exit 1
          }
          report "accounts/<id>/tokens/verify" "$acct_body"
          if active "$acct_body"; then
            echo "token verified: active (account-owned token)"
            exit 0
          fi

          echo "::error title=CLOUDFLARE_API_TOKEN::token rejected by BOTH the user and account-owned registries, so this is the credential and not the endpoint. Delete any repository-level CLOUDFLARE_API_TOKEN shadowing the org secret, then rotate the org secret: mint a token with Zone:Zone:Read, Zone:Workers Routes:Edit, Zone:DNS:Edit on dmzagent.com plus Account:Workers KV Storage:Edit, Account:Workers Scripts:Edit, Account:Cloudflare Pages:Edit."
          exit 1

      - name: Terraform init
        run: terraform init
        working-directory: ./terraform
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Import existing resources
        continue-on-error: true
        run: |
          chmod +x import-resources.sh
          ./import-resources.sh
        working-directory: ./terraform
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_pages_project_name: skill-builder-landing

      - name: Terraform plan
        run: terraform plan -out=tfplan
        working-directory: ./terraform
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve tfplan
        working-directory: ./terraform
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Export deployment config
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          chmod +x export-config.sh
          ./export-config.sh
        working-directory: ./terraform

      - name: Save Terraform state
        if: always()
        uses: actions/cache@v4
        with:
          path: terraform/terraform.tfstate
          key: terraform-state-${{ hashFiles('terraform/*.tf') }}

